<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carpool Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
  :root{ --ink:#1E293B; --muted:#94A3B8; --line:#E7E9EF; --paper:#F6F7FB; --card:#fff; --sub:#64748B; --brand:#4F46E5; }
  @media (prefers-color-scheme:dark){ :root{ --ink:#E8ECF3; --muted:#7B8798; --line:#2A2F3A; --paper:#0F1319; --card:#171C24; --sub:#9AA6B6; } }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);
    line-height:1.45;padding:24px 16px 60px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;margin:0 auto;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700;}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:28px;margin:4px 0 3px;}
  .back{font-size:13px;color:var(--sub);text-decoration:none;}
  .back:hover{color:var(--ink);}
  .env{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;margin-left:8px;
    background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px;
    box-shadow:0 8px 24px -16px rgba(16,24,40,.25);}
  .card h2{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600;margin-bottom:4px;}
  .card .desc{font-size:12.5px;color:var(--sub);margin-bottom:14px;}
  label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:12px 0 5px;}
  input{width:100%;font:inherit;font-size:14.5px;padding:11px 13px;border-radius:11px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;font:inherit;
    font-size:14px;font-weight:700;padding:12px;border-radius:12px;border:none;cursor:pointer;
    background:var(--brand);color:#fff;margin-top:16px;}
  .btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .btn:active{transform:scale(.98);}
  .msg{font-size:12.5px;margin-top:10px;min-height:16px;font-weight:600;}
  .msg.ok{color:#16A34A;} .msg.err{color:#DB2777;}
  .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);margin-top:8px;}
  .who b{color:var(--ink);}
  .who .out{margin-left:auto;font-size:12px;font-weight:700;color:#DB2777;background:none;border:none;cursor:pointer;}
  .soon{font-size:12px;color:var(--muted);margin-top:6px;}
</style>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDP7FpkwN9oWInx5RU2LrfD9uwnm28I4j4",
  authDomain: "carpool-67212.firebaseapp.com",

const DB_PREFIX = (location.pathname.indexOf('/staging/')>=0) ? 'stg/' : '';
if(DB_PREFIX){ const t=document.getElementById('envTag'); if(t) t.style.display=''; }
let auth=null, db=null, user=null;
try{ firebase.initializeApp(FIREBASE_CONFIG); auth=firebase.auth(); db=firebase.database();
  auth.onAuthStateChanged(u=>{ user=u; render(); });
}catch(e){ document.getElementById('content').innerHTML='<div class="card">Firebase not configured.</div>'; }
function dref(p){ return db.ref(DB_PREFIX+p); }
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const c=document.getElementById('content');
  if(!user){
    c.innerHTML=
      '<div class="card"><h2>Admin sign in</h2>'+
      '<div class="desc">Only carpool admins can change settings.</div>'+
      '<label>Email</label><input id="email" type="email" autocomplete="username">'+
      '<label>Password</label><input id="pass" type="password" autocomplete="current-password">'+
      '<button class="btn" id="loginBtn">Log in</button>'+
      '<div class="msg" id="loginMsg"></div></div>';
    document.getElementById('loginBtn').onclick=doLogin;
    document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
    return;
  }
  const name=(user.displayName)||(user.email||'admin');
  c.innerHTML=
    '<div class="who">Signed in as <b>'+esc(name)+'</b><button class="out" id="outBtn">Sign out</button></div>'+
    '<div class="card"><h2>School header</h2>'+
    '<div class="desc">Shown at the top of the calendar. Changes apply live.</div>'+
    '<label>Eyebrow (school + year)</label><input id="fOrg" placeholder="Thornton Middle School · 2026–27">'+
    '<label>Title</label><input id="fTitle" placeholder="School Carpool">'+
    '<label>Subtitle</label><input id="fSub" placeholder="Leave home 7:30 AM · pickup 2:00 PM">'+
    '<label>School website URL</label><input id="fUrl" type="url" placeholder="https://school.example.org/">'+
    '<label>WhatsApp group invite link</label><input id="fWa" type="url" placeholder="https://chat.whatsapp.com/…">'+
    '<label>Live camera link <span style="font-weight:400;opacity:.7">(Ring / camera — shown to families only during carpool windows)</span></label><input id="fCam" type="url" placeholder="https://account.ring.com/… or your camera share link">'+
    '<button class="btn" id="saveHeader">Save school details</button>'+
    '<div class="msg" id="hmsg"></div></div>'+
    '<div class="card"><h2>📅 Bell schedule</h2>'+
    '<div class="desc">Upload the school calendar (<b>.ics</b> from Google/Outlook) or a CSV/JSON. Holidays &amp; minimum days are detected automatically and the calendar rebuilds from it.</div>'+
    '<button class="btn sec" id="dlTemplate">⬇️ Download CSV template</button>'+
    '<label>Upload schedule file (.ics, .csv or .json)</label>'+
    '<input id="schedFile" type="file" accept=".ics,.csv,.json,text/calendar">'+
    '<div id="schedPreview" class="desc" style="margin-top:10px"></div>'+
    '<button class="btn" id="saveSched" disabled>Save schedule</button>'+
    '<div class="msg" id="smsg"></div></div>'+
    '<div class="card"><h2>⏰ Carpool &amp; camera times</h2>'+
    '<div class="desc">When the live camera appears for families (and when auto-record runs). Applies to both the live site and staging.</div>'+
    '<label>Morning window</label>'+
    '<div style="display:flex;gap:8px;align-items:center"><input id="tmS" type="time" style="flex:1"> <span>to</span> <input id="tmE" type="time" style="flex:1"></div>'+
    '<label>Afternoon window</label>'+
    '<div style="display:flex;gap:8px;align-items:center"><input id="taS" type="time" style="flex:1"> <span>to</span> <input id="taE" type="time" style="flex:1"></div>'+
    '<label>Afternoon on minimum days</label>'+
    '<div style="display:flex;gap:8px;align-items:center"><input id="tmdS" type="time" style="flex:1"> <span>to</span> <input id="tmdE" type="time" style="flex:1"></div>'+
    '<button class="btn" id="saveTimes">Save times</button>'+
    '<div class="msg" id="tmsg"></div></div>'+
    '<div class="card"><h2>👁️ External viewers (approval)</h2>'+
    '<div class="desc">People who request access on your <b>watch page</b> (<code>watch.html</code>) appear here. Approve to create their private link; revoke anytime and their link stops working.</div>'+
    '<label>Camera stream address <span style="font-weight:400;opacity:.7">(the https://… base of your bridge/tunnel — no /live)</span></label>'+
    '<input id="sBase" type="url" placeholder="https://xxxx.trycloudflare.com">'+
    '<button class="btn" id="saveBase">Save stream address</button>'+
    '<div class="msg" id="bmsg"></div>'+
    '<h3 style="margin:18px 0 6px;font-size:14px">Pending requests</h3><div id="reqList" class="desc">Loading…</div>'+
    '<h3 style="margin:18px 0 6px;font-size:14px">Approved viewers</h3><div id="viewerList" class="desc">Loading…</div>'+
    '<div class="msg" id="vmsg"></div></div>'+
    '<div class="card"><h2>More settings</h2>'+
    '<div class="soon">Contacts, kids, drivers and rotation editors are coming next.</div></div>';
  document.getElementById('outBtn').onclick=()=>auth.signOut();
  document.getElementById('saveHeader').onclick=saveHeader;
  document.getElementById('saveTimes').onclick=saveTimes;
  document.getElementById('saveBase').onclick=saveStreamBase;
  db.ref('access/streamBase').once('value').then(s=>{ const el=document.getElementById('sBase'); if(el) el.value=s.val()||''; }).catch(()=>{});
  listenAccess();
  document.getElementById('dlTemplate').onclick=downloadTemplate;
  document.getElementById('schedFile').onchange=onSchedFile;
  document.getElementById('saveSched').onclick=saveSchedule;
  // prefill from current config
  dref('config/header').once('value').then(s=>{ const v=s.val()||{};
    if(document.getElementById('fOrg')){ document.getElementById('fOrg').value=v.org||'';
      document.getElementById('fTitle').value=v.title||''; document.getElementById('fSub').value=v.subtitle||'';
      document.getElementById('fUrl').value=v.schoolUrl||''; document.getElementById('fWa').value=v.whatsapp||''; }
  }).catch(()=>{});
  // camera link is private → read from the auth-gated /secure/cameraUrl node
  dref('secure/cameraUrl').once('value').then(s=>{ if(document.getElementById('fCam')) document.getElementById('fCam').value=s.val()||''; }).catch(()=>{});
  // carpool/camera window times (public config, with sensible defaults)
  dref('config/windows').once('value').then(s=>{ const w=s.val()||{};
    const set=(id,val)=>{ const el=document.getElementById(id); if(el) el.value=val||''; };
    const m=w.morning||{}, a=w.afternoon||{}, d=w.minDayAfternoon||{};
    set('tmS', m.start||'07:20'); set('tmE', m.end||'08:30');
    set('taS', a.start||'13:40'); set('taE', a.end||'15:00');
    set('tmdS', d.start||'12:00'); set('tmdE', d.end||'13:00');
  }).catch(()=>{});
}
function saveTimes(){
  const g=id=>{ const el=document.getElementById(id); return el?el.value.trim():''; };
  const win={ morning:{start:g('tmS'),end:g('tmE')}, afternoon:{start:g('taS'),end:g('taE')}, minDayAfternoon:{start:g('tmdS'),end:g('tmdE')} };
  const m=document.getElementById('tmsg'); m.className='msg';
  for(const [k,v] of Object.entries(win)){ if(!/^\d\d:\d\d$/.test(v.start)||!/^\d\d:\d\d$/.test(v.end)){ m.className='msg err'; m.textContent='Please fill all start and end times (HH:MM).'; return; } if(v.start>=v.end){ m.className='msg err'; m.textContent='Each window\u2019s start must be before its end ('+k+').'; return; } }
  m.textContent='Saving…';
  dref('config/windows').set({...win,by:user.uid,ts:Date.now()})
    .then(()=>{ m.className='msg ok'; m.textContent='Saved ✓  (camera + carpool times updated live)'; })
    .catch(e=>{ m.className='msg err'; m.textContent='Could not save: '+(e.message||''); });
}
// ---- Bell schedule upload ----
let parsedSchedule=null;
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function parseICS(text){
  text=text.replace(/\r?\n[ \t]/g,'');                 // unfold folded lines
  const NO=/no school|holiday|recess|break|no student|non.?student|day off|closed|thanksgiv|winter|spring break|memorial|labor day|president|veteran|mlk|martin luther|new year|christmas|independence|indigenous|columbus|cesar chavez|lunar|staff development|pupil free/i;
  const MIN=/minimum day|early dismissal|early release|shorten/i;
  const FIRSTre=/first day of school/i, LASTre=/last day of school/i;
  const iso=d=>d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
  const evs=[];
  text.split('BEGIN:VEVENT').slice(1).forEach(bl=>{ const b=bl.split('END:VEVENT')[0];
    const sm=(b.match(/^SUMMARY[^:]*:(.+)$/m)||[])[1]||'';
    const ds=b.match(/DTSTART[^:]*:(\d{8})(T(\d{2})(\d{2}))?/), de=b.match(/DTEND[^:]*:(\d{8})/);
    if(ds) evs.push({s:ds[1], e:de?de[1]:null, sm, timed:!!ds[2], hh:ds[3], mm:ds[4]}); });
  // find the school-year window from first/last day events (fallback: around now)
  let first='', last='';
  evs.forEach(v=>{ if(FIRSTre.test(v.sm)) first=first?first:iso(v.s); if(LASTre.test(v.sm)) last=iso(v.s); });
  const now=new Date(); const win0=first||new Date(now.getFullYear(), now.getMonth()-1,1).toISOString().slice(0,10);
  const win1=last||new Date(now.getFullYear()+1, now.getMonth(),1).toISOString().slice(0,10);
  const inr=d=>d>=win0 && d<=win1;
  function expand(s,e){ const sd=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));
    const ed=e?new Date(+e.slice(0,4),+e.slice(4,6)-1,+e.slice(6,8)):new Date(sd.getTime()+864e5);
    const out=[]; let cur=new Date(sd),g=0; while(cur<ed && g++<40){ out.push(cur.toISOString().slice(0,10)); cur=new Date(cur.getTime()+864e5);} return out; }
  function clean(s){ s=s.replace(/\s*\(.*?\)/,'').trim().replace(/^No School\s*-\s*/i,'').replace(/^No School\s*$/i,'No school');
    if(/Thanksgiving Break/i.test(s)) s='Thanksgiv.'; else if(/Winter Break|Spring Break/i.test(s)) s='Break'; return s.slice(0,12); }
  const holidays={}, minimum=new Set(), events={};
  const addEvent=(d,title)=>{ if(!events[d]) events[d]=[]; if(events[d].length<8 && !events[d].some(x=>x.t===title)) events[d].push({t:title}); };
  evs.forEach(v=>{ if(!inr(iso(v.s))) return;
    if(MIN.test(v.sm)) expand(v.s,v.e).forEach(d=>{ if(inr(d)) minimum.add(d); });
    else if(NO.test(v.sm)) expand(v.s,v.e).forEach(d=>{ if(inr(d)) holidays[d]=clean(v.sm); });
    // ALL events (for per-day display): timed = start day only; all-day = each covered day
    const title=v.sm.slice(0,60);
    const days=v.timed?[iso(v.s)]:expand(v.s,v.e);
    days.forEach(d=>{ if(inr(d)) addEvent(d,title); });
  });
  return { first:first||win0, last:last||win1, holidays, minimumDays:[...minimum].sort(), events };
}
function parseSchedule(text,fname){
  text=(text||'').trim();
  if((fname||'').toLowerCase().endsWith('.ics') || /BEGIN:VCALENDAR/i.test(text)) return parseICS(text);
  if((fname||'').toLowerCase().endsWith('.json') || text[0]==='{'){
    const o=JSON.parse(text);
    return { first:o.first||'', last:o.last||'', subtitle:o.subtitle||'',
      holidays:o.holidays||{}, minimumDays:Array.isArray(o.minimumDays)?o.minimumDays:[],
      events:o.events||{} };
  }
  const out={first:'',last:'',holidays:{},minimumDays:[]};
  text.split(/\r?\n/).forEach((ln,i)=>{
    const p=ln.split(',').map(s=>s.trim()); if(!p[0]) return;
    if(i===0 && /date/i.test(p[0])) return;                    // header row
    const date=p[0], t=(p[1]||'').toLowerCase(), label=p[2]||'';
    if(!DATE_RE.test(date)) return;
    if(t==='holiday'||t==='no-school'||t==='noschool') out.holidays[date]=label||'No school';
    else if(t==='minimum'||t==='min'||t==='early') out.minimumDays.push(date);
    else if(t==='first'||t==='start') out.first=date;
    else if(t==='last'||t==='end') out.last=date;
  });
  return out;
}
function onSchedFile(ev){
  const f=ev.target.files&&ev.target.files[0]; const prev=document.getElementById('schedPreview');
  const save=document.getElementById('saveSched'); const m=document.getElementById('smsg'); m.className='msg'; m.textContent='';
  if(!f){ return; }
  const rd=new FileReader();
  rd.onload=()=>{ try{
    parsedSchedule=parseSchedule(rd.result,f.name);
    const hn=Object.keys(parsedSchedule.holidays||{}).length, mn=(parsedSchedule.minimumDays||[]).length;
    prev.innerHTML='Parsed: <b>'+esc(parsedSchedule.first||'?')+'</b> → <b>'+esc(parsedSchedule.last||'?')+'</b><br>'+
      hn+' no-school days · '+mn+' minimum days';
    save.disabled=false;
  }catch(e){ parsedSchedule=null; save.disabled=true; prev.textContent=''; m.className='msg err'; m.textContent='Could not parse file: '+(e.message||''); } };
  rd.readAsText(f);
}
function saveSchedule(){
  if(!parsedSchedule){ return; }
  const m=document.getElementById('smsg'); m.className='msg'; m.textContent='Saving…';
  const events=parsedSchedule.events||{};
  const sched={ first:parsedSchedule.first, last:parsedSchedule.last,
    holidays:parsedSchedule.holidays||{}, minimumDays:parsedSchedule.minimumDays||[],
    subtitle:parsedSchedule.subtitle||'', by:user.uid, ts:Date.now() };
  Promise.all([ dref('config/schedule').set(sched), dref('config/events').set(events) ])
    .then(()=>{ m.className='msg ok'; m.textContent='Saved ✓  calendar rebuilt · '+Object.keys(events).length+' days with school events.'; })
    .catch(e=>{ m.className='msg err'; m.textContent='Could not save: '+(e.message||''); });
}
// ===== External viewers: approval + revocation =====
const WATCH_BASE = location.origin + '/Carppol/watch.html';
function esc2(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function sha256hex(str){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function randToken(){ const a=new Uint8Array(24); crypto.getRandomValues(a); return [...a].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function saveStreamBase(){
  let raw=document.getElementById('sBase').value.trim(), base='';
  // store ONLY the origin — never a path or ?k= key (this value is public)
  try{ base=new URL(raw).origin; }catch(_){ base=raw.replace(/\/live\b.*$/,'').replace(/\/+$/,''); }
  const m=document.getElementById('bmsg'); m.className='msg'; m.textContent='Saving…';
  document.getElementById('sBase').value=base;
  db.ref('access/streamBase').set(base)
    .then(()=>{ m.className='msg ok'; m.textContent='Saved ✓'; })
    .catch(e=>{ m.className='msg err'; m.textContent='Could not save: '+(e.message||''); });
}
function listenAccess(){
  db.ref('access/requests').on('value', snap=>{
    const o=snap.val()||{}; const rows=Object.entries(o).filter(([,v])=>v&&(v.status||'pending')==='pending');
    const el=document.getElementById('reqList'); if(!el) return;
    if(!rows.length){ el.textContent='No pending requests.'; return; }
    el.innerHTML=rows.map(([id,v])=>
      '<div style="border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin:8px 0">'+
        '<b>'+esc2(v.name||(v.first+' '+v.last))+'</b><br>'+
        '<span style="color:#6b7280;font-size:12.5px">📞 '+esc2(v.phone||'—')+' · 🏠 House '+esc2(v.house||'—')+'</span><br>'+
        '<button class="btn" style="width:auto;padding:7px 13px;margin-top:8px" data-ap="'+id+'">Approve</button> '+
        '<button class="btn sec" style="width:auto;padding:7px 13px;margin-top:8px;color:#b91c1c" data-dn="'+id+'">Deny &amp; delete</button>'+
      '</div>').join('');
    el.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>approveRequest(b.dataset.ap, o[b.dataset.ap]));
    el.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>denyRequest(b.dataset.dn));
  });
  db.ref('access/viewers').on('value', snap=>{
    const o=snap.val()||{}; const rows=Object.entries(o).filter(([,v])=>v);
    const el=document.getElementById('viewerList'); if(!el) return;
    if(!rows.length){ el.textContent='No viewers yet.'; return; }
    el.innerHTML=rows.map(([id,v])=>{
      const link=esc2(WATCH_BASE+'?t='+v.token);
      const active=!!v.active;
      const badge=active?'<span style="color:#059669;font-weight:700">● Active</span>':'<span style="color:#b91c1c;font-weight:700">● Revoked</span>';
      return '<div style="border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin:8px 0">'+
        '<b>'+esc2(v.name)+'</b> <span style="color:#6b7280;font-size:12px">🏠 '+esc2(v.house||'—')+'</span> · '+badge+'<br>'+
        (active?'<input readonly value="'+link+'" style="font-size:11.5px;margin:6px 0" onclick="this.select()">':'')+
        (active?'<button class="btn sec" style="width:auto;padding:6px 12px" data-cp="'+link+'">Copy link</button> ':'')+
        (active?'<button class="btn sec" style="width:auto;padding:6px 12px;color:#b45309" data-rv="'+id+'" data-hash="'+esc2(v.hash)+'">Revoke</button> ':'')+
        '<button class="btn sec" style="width:auto;padding:6px 12px;color:#b91c1c" data-del="'+id+'" data-hash="'+esc2(v.hash)+'">🗑 Delete</button>'+
      '</div>';
    }).join('');
    el.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{ navigator.clipboard.writeText(b.dataset.cp); b.textContent='Copied ✓'; });
    el.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>revokeViewer(b.dataset.rv, b.dataset.hash));
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteViewer(b.dataset.del, b.dataset.hash));
  });
}
async function approveRequest(id, v){
  const m=document.getElementById('vmsg'); m.className='msg'; m.textContent='Approving…';
  try{
    const token=randToken(); const hash=await sha256hex(token);
    await db.ref('access/viewers/'+id).set({ name:v.name||((v.first||'')+' '+(v.last||'')).trim(), phone:v.phone||'', house:v.house||'', token, hash, active:true, ts:Date.now() });
    await db.ref('access/tokenHashes/'+hash).set(true);
    await db.ref('access/requests/'+id+'/status').set('approved');
    m.className='msg ok'; m.textContent='Approved ✓ — private link created (copy it below and send to them).';
  }catch(e){ m.className='msg err'; m.textContent='Could not approve: '+(e.message||''); }
}
function denyRequest(id){
  if(!confirm('Delete this request?')) return;
  db.ref('access/requests/'+id).remove().catch(()=>{});
}
function revokeViewer(id, hash){
  const m=document.getElementById('vmsg'); m.className='msg'; m.textContent='Revoking…';
  Promise.all([ db.ref('access/viewers/'+id+'/active').set(false), db.ref('access/tokenHashes/'+hash).remove() ])
    .then(()=>{ m.className='msg ok'; m.textContent='Revoked ✓ — their link stops working within ~20s.'; })
    .catch(e=>{ m.className='msg err'; m.textContent='Could not revoke: '+(e.message||''); });
}
function deleteViewer(id, hash){
  if(!confirm('Permanently delete this viewer and their access? This cannot be undone.')) return;
  const m=document.getElementById('vmsg'); m.className='msg'; m.textContent='Deleting…';
  Promise.all([
    db.ref('access/viewers/'+id).remove(),
    hash? db.ref('access/tokenHashes/'+hash).remove() : Promise.resolve(),
    hash? db.ref('access/deviceClaims/'+hash).remove() : Promise.resolve()
  ])
    .then(()=>{ m.className='msg ok'; m.textContent='Deleted ✓ — viewer removed and their link is dead.'; })
    .catch(e=>{ m.className='msg err'; m.textContent='Could not delete: '+(e.message||''); });
}
function downloadTemplate(){
  const csv='date,type,label\n'+
    '2026-08-11,first,First day of school\n'+
    '2027-06-01,last,Last day of school\n'+
    '2026-09-07,holiday,Labor Day\n'+
    '2026-11-26,holiday,Thanksgiving\n'+
    '2026-08-11,minimum,Minimum day\n';
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='bell-schedule-template.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function doLogin(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  const m=document.getElementById('loginMsg'); m.className='msg'; m.textContent='';
  if(!email||!pass){ m.className='msg err'; m.textContent='Enter email and password.'; return; }
  auth.signInWithEmailAndPassword(email,pass).catch(e=>{ m.className='msg err'; m.textContent=(e.message||'Login failed').replace('Firebase: ',''); });
}
function saveHeader(){
  const org=document.getElementById('fOrg').value.trim();
  const title=document.getElementById('fTitle').value.trim();
  const subtitle=document.getElementById('fSub').value.trim();
  const schoolUrl=document.getElementById('fUrl').value.trim();
  const whatsapp=document.getElementById('fWa').value.trim();
  const cameraUrl=document.getElementById('fCam')?document.getElementById('fCam').value.trim():'';
  const m=document.getElementById('hmsg'); m.className='msg'; m.textContent='Saving…';
  // public display fields → /config/header ; private camera link → auth-gated /secure/cameraUrl
  Promise.all([
    dref('config/header').set({org,title,subtitle,schoolUrl,whatsapp,by:user.uid,ts:Date.now()}),
    dref('secure/cameraUrl').set(cameraUrl)
  ])
    .then(()=>{ m.className='msg ok'; m.textContent='Saved ✓  (camera link kept private — signed-in families only)'; })
    .catch(e=>{ m.className='msg err'; m.textContent='Could not save: '+(e.message||''); });
}
</script>
